schema: spec-driven

context: |
  Language: ru
  All artifacts must be written in ru.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.

# Per-artifact rules (optional)
rules:
  specs:
    - |
      Если требование появляется из-за дефекта или ограничения ВНЕ этого репозитория
      (другой репозиторий, платформа Airflow, сервер Greenplum, чужая система), добавь
      строку в раздел «## Происхождение» в конце соответствующего openspec/specs/
      <capability>/spec.md: требование | откуда шрам | когда его разумно пересматривать.
      Раздел живёт вне «## Requirements», archive его не трогает. Тело требования при
      этом остаётся про «что обязано работать» — историю туда не переносить.
    - |
      Не путай шрам с замыслом. Защита от неосторожного оператора, отличие «сломалось» от
      «не проверялось», устойчивость к недоступности одной системы — это замысел, строка
      в «Происхождение» им не нужна.

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing
